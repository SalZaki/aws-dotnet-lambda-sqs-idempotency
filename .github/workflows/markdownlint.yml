name: markdownlint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately unfiltered by path. The default-branch ruleset requires the `lint` check, and a
# filtered workflow does not report at all on a pull request that touches no markdown — GitHub reads
# a check that never ran as outstanding rather than as passed, so such a pull request can never
# merge. That is not hypothetical: it blocked the fix for a main that did not compile.
#
# A required check therefore has to run on every pull request. The linter itself is quick, and it has
# nothing to do on a change that touches no markdown.

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to an immutable commit SHA rather than a
      # tag, so a moved tag cannot change what runs. Update deliberately.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          # Globs and rules come from .markdownlint-cli2.jsonc so that a local
          # `npx markdownlint-cli2` run and CI cannot disagree.
          config: '.markdownlint-cli2.jsonc'
          globs: '**/*.md'
