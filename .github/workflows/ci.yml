name: ci

# A build gate, not the full pull-request pipeline. Story #33 owns that, and most of it cannot be
# written yet: there are no integration tests, no CDK project to synth, and no coverage collection.
# What is here is the part that would have caught main being merged in a state that does not compile,
# which is why it exists ahead of its milestone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately unfiltered by path. A gate that skips on some changes reports "not run" rather than
# "passed", which is the wrong answer once these checks become required for merge.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to an immutable commit SHA rather than a
      # tag, so a moved tag cannot change what runs. Update deliberately.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The SDK comes from global.json so that CI and a developer machine cannot
      # resolve different versions of the compiler and analyzers.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Locked mode fails when the resolved graph differs from the committed
      # packages.lock.json, so CI restores the graph that was reviewed rather
      # than whatever resolves today.
      - name: Restore
        run: dotnet restore ReliableOrders.slnx --locked-mode

      # Before the build, so a formatting failure is reported as itself rather
      # than buried under compiler output.
      - name: Verify formatting
        run: dotnet format ReliableOrders.slnx --verify-no-changes --no-restore

      # Release, because TreatWarningsAsErrors and the analyzer set are what turn
      # a malformed XML doc comment or an unused private field into a failure.
      - name: Build
        run: dotnet build ReliableOrders.slnx -c Release --no-restore

      # Container-backed tests are excluded and run in integration.yml instead. They pull a large
      # image and start a container, which is minutes against a gate that otherwise finishes in well
      # under one. Expressed as an exclusion rather than an inclusion on purpose: a new test project
      # nobody remembers to wire up still runs here, which is the safe direction to be wrong in.
      - name: Test
        id: test
        run: >
          dotnet test ReliableOrders.slnx -c Release --no-build --filter "Category!=Integration"
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Written to the run summary rather than left inside the artifact. A number nobody reads cannot
      # inform the threshold decision it exists to inform, and reading it otherwise means downloading a
      # zip and opening Cobertura XML.
      #
      # Conditioned on the tests having run, not on always(). After a compile failure there is no
      # coverage to publish, and reporting that as a second red step points at the wrong cause.
      # The !cancelled() guard is load-bearing: an `if` carrying no status function implicitly gets
      # success(), which would skip this exactly when a test failed and the numbers matter most.
      - name: Summarise coverage
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: |
          report=$(find ./coverage -name coverage.cobertura.xml | head -1)
          if [ -z "$report" ]; then
            echo "::error::No coverage report was produced."
            exit 1
          fi
          python3 - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("## Coverage\n")
          print("| Scope | Lines | Branches |")
          print("| --- | --- | --- |")
          print("| Total | %.1f%% | %.1f%% |" % (
              float(root.get("line-rate")) * 100, float(root.get("branch-rate")) * 100))
          for pkg in root.iter("package"):
              print("| %s | %.1f%% | %.1f%% |" % (
                  pkg.get("name"), float(pkg.get("line-rate")) * 100, float(pkg.get("branch-rate")) * 100))
          PY

      # Collected and published, not enforced. A threshold is a number the team has to agree, and one
      # picked here would either sit below what the suite already reaches, which proves nothing, or
      # block work unrelated to the code that moved it.
      - name: Publish coverage
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error
