# Version updates. Security updates are a separate mechanism, already enabled on the repository, and
# they are deliberately left ungrouped: a CVE fix should arrive as its own pull request rather than
# wait for whatever else its group is holding.

version: 2

updates:
  # NuGet resolves through central package management, so every bump lands in
  # Directory.Packages.props and the per-project lock files are regenerated from it. The directory
  # is the repository root for that reason, not the project folders.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    commit-message:
      prefix: chore(deps)
    # xunit's next major is a migration rather than a bump, and it is tracked as its own piece of
    # work. Version 4 drops the VSTest bridge on the .NET 10 SDK, so every test project stops running
    # under the command CI invokes until the suite moves to Microsoft.Testing.Platform — which
    # changes the filter, the report and the coverage flags, and therefore the workflows and the
    # tests that assert on them. Proposed weekly it is a red pull request nobody can merge; ignored,
    # it waits for the story that does it properly. Remove both entries with that story.
    ignore:
      - dependency-name: xunit.v3
        update-types: [version-update:semver-major]
      - dependency-name: xunit.runner.visualstudio
        update-types: [version-update:semver-major]
    # Grouped by what a reviewer reads together. The AWS SDK and the CDK move on their own weekly
    # cadences and would otherwise account for most of the noise on their own, and the test
    # dependencies are the group whose failure mode is contained to a build that will not compile.
    groups:
      aws-sdk:
        patterns:
          - AWSSDK.*
          - Amazon.Lambda.*
      aws-cdk:
        patterns:
          - Amazon.CDK.*
          - Constructs
      opentelemetry:
        patterns:
          - OpenTelemetry*
      testing:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - Microsoft.Extensions.TimeProvider.Testing
          - Testcontainers*
          - coverlet.collector
      # Excluding what the testing group above already claims. Dependabot matches a package against
      # every group rather than the first one that fits, so Microsoft.Extensions.TimeProvider.Testing
      # arrived in two pull requests at once on the first run — each proposing the same bump, and
      # whichever merged second would have conflicted with the first.
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
        exclude-patterns:
          - Microsoft.Extensions.TimeProvider.Testing

  # The workflows pin every third-party action to a commit SHA, which no ecosystem resolves and no
  # human rereads. This is what keeps a pinned SHA from silently becoming an unmaintained one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - "*"

  # The CDK CLI, which is pinned separately from Amazon.CDK.Lib because it releases separately. One
  # package, so grouping would say nothing.
  - package-ecosystem: npm
    directory: /infra/ReliableOrders.Cdk
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    commit-message:
      prefix: chore(deps)
